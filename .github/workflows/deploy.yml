name: Deploy and Healthcheck

on:
  push:
    branches: [main]

jobs:
  verify-and-rollback:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - name: Wait for Render deploy to finish
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1" \
              | jq -r '.[0].deploy.status')
            echo "Deploy status: $STATUS"
            if [ "$STATUS" = "live" ]; then
              break
            fi
            if [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "update_failed" ] || [ "$STATUS" = "canceled" ]; then
              echo "Deploy failed outright: $STATUS"
              exit 1
            fi
            sleep 10
          done

      - name: Health check
        id: healthcheck
        run: |
          for i in $(seq 1 10); do
            if curl -sf "$APP_URL/health"; then
              echo "healthy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "healthy=false" >> "$GITHUB_OUTPUT"

      - name: Roll back to last known-good deploy
        if: steps.healthcheck.outputs.healthy != 'true'
        run: |
          echo "Health check failed. Rolling back..."

          LAST_GOOD_ID=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=2" \
            | jq -r '.[1].deploy.id')

          if [ -z "$LAST_GOOD_ID" ] || [ "$LAST_GOOD_ID" = "null" ]; then
            echo "Could not find a previous healthy deploy to roll back to."
            exit 1
          fi

          echo "Rolling back to deploy $LAST_GOOD_ID"
          curl -s -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"deployId\": \"$LAST_GOOD_ID\"}" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/rollback"

          echo "Disabling autoDeploy to prevent the bad commit from redeploying"
          curl -s -X PATCH -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"autoDeploy": "no"}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID"

          echo "Automated rollback complete. Service restored to deploy $LAST_GOOD_ID."
          echo "autoDeploy has been disabled — a human must re-enable it after investigating."
          exit 1
